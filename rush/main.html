<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
     margin: 0;
     min-height: 100vh;
     font-family: "Poppins", sans-serif;
     color: #333;
    text-align: center;
    overflow-x: hidden;
    background: 
    linear-gradient(rgba(255, 255, 255, 0.7), rgba(214, 214, 214, 0.7)),
    url('assets/background.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  position: relative;
}


    /* Floating bubbles in background */
    .bubble {
      position: absolute;
      border-radius: 50%;
      opacity: 0.25;
      animation: float 10s infinite ease-in-out;
      z-index: 0;
    }

    .bubble:nth-child(1) {
      width: 120px;
      height: 120px;
      background: #ffd6e0;
      top: 20%;
      left: 10%;
      animation-delay: 0s;
    }

    .bubble:nth-child(2) {
      width: 150px;
      height: 150px;
      background: #c5e1ff;
      top: 60%;
      left: 80%;
      animation-delay: 3s;
    }

    .bubble:nth-child(3) {
      width: 100px;
      height: 100px;
      background: #fff0b3;
      top: 75%;
      left: 30%;
      animation-delay: 5s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      margin-top: 70px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #2a2a2a;
      position: relative;
      z-index: 1;
    }

    .divider {
      width: 90px;
      height: 4px;
      background-color: #93b9f7;
      margin: 15px auto 40px;
      border-radius: 10px;
      z-index: 1;
      position: relative;
    }

    .card {
  border: none;
  border-radius: 20px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
  transition: transform 0.3s, box-shadow 0.3s;
  background-color: #ffffffcc;
  backdrop-filter: blur(8px);
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  position: relative;
}

.card .overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  border-radius: 20px;
  z-index: 1;
  transition: background 0.3s;
}

.card:hover .overlay {
  background: rgba(0, 0, 0, 0.55);
}
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .btn-primary {
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 30px;
  padding: 10px 25px;
  color: #fff;
  font-weight: 500;
  backdrop-filter: blur(6px);
  transition: all 0.3s ease;
}

.btn-primary:hover {
  background: rgba(255, 255, 255, 0.5);
  color: #333;
}


    footer {
      margin-top: 60px;
      padding: 20px 0;
      font-size: 0.9rem;
      color: #666;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- floating decorations -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <h1>Welcome</h1>
  <div class="divider"></div>
  <p class="mb-5 text-muted">Choose a portfolio to explore</p>

  <div class="container">
    <div class="row justify-content-center g-4">

 <div class="col-12 col-md-5">
  <div class="card p-4 text-white" style="background-image: url('assets/ghostrule.png'); background-size: cover; background-position: center; position: relative; overflow: hidden;">
    <div class="overlay"></div>
    <div style="position: relative; z-index: 2;">
      <h3>Sirakarn</h3>
      <p>Digital Artist & Java Developer</p>
      <a href="conan.html" class="btn btn-primary">View Portfolio</a>
    </div>
  </div>
</div>

 <div class="col-12 col-md-5">
  <div class="card p-4 text-white" style="background-image: url('assets/khaohom.png'); background-size: cover; background-position: center; position: relative; overflow: hidden;">
    <div class="overlay"></div>
    <div style="position: relative; z-index: 2;">
      <h3>Khaohom</h3>
      <p>Creative Designer</p>
      <a href="khaohom.html" class="btn btn-primary">View Portfolio</a>
    </div>
  </div>
</div>

  <footer>
    <p>© 2025 Portfolio. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
