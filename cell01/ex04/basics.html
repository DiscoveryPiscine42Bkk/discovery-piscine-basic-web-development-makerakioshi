<html>
  <head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
      body {
        background-color: pink; 
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      h1 {
        color: white;       
        text-align: center;        
        font-size: 3em;            
        margin-top: 30px;
      }

      .shop-container {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin-top: 30px;
      }

      .shop {
        text-align: center;
      }

      .shop img {
        width: 300px;
        height: auto;
        border: 3px solid white;
        border-radius: 10px;
      }

      hr {
        margin: 50px auto;
        width: 90%;
        border: 1px solid white;
      }

      footer {
        text-align: right;
        font-style: italic;
        font-family: monospace;
        color: white;
        margin-right: 20px;
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <h1>★ Welcome to the Web Basics ★</h1>

    <div class="shop-container">
      <div class="shop">
        <img src="amazon.png" alt="Online Shop 1">
        <p><a href="https://www.amazon.com" target="_blank">Visit Amazon</a></p>
      </div>

      <div class="shop">
        <img src="ebay.png" alt="Online Shop 2">
        <p><a href="https://www.ebay.com" target="_blank">Visit eBay</a></p>
      </div>
    </div>

    <hr>

    <footer>
      © yourlogin 2025
    </footer>
  </body>
</html>
